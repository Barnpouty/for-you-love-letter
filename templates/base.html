<!doctype html>
<html lang="{{ c.html_lang }}" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ c.meta.title }}</title>
  <meta name="description" content="{{ c.meta.description }}">
  <link rel="canonical" href="{{ canonical }}">
  <link rel="alternate" hreflang="en" href="{{ site_url }}/en">
  <link rel="alternate" hreflang="pt" href="{{ site_url }}/pt">
  <link rel="alternate" hreflang="x-default" href="{{ site_url }}/">
  <meta name="theme-color" content="#F6EEDF">
  <meta name="color-scheme" content="light">

  {# Open Graph #}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="For You">
  <meta property="og:title" content="{{ c.meta.og_title }}">
  <meta property="og:description" content="{{ c.meta.og_description }}">
  <meta property="og:url" content="{{ canonical }}">
  <meta property="og:image" content="{{ site_url }}{{ url_for('static', filename='images/og-image.jpg') }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ c.product.mockup_alt }}">
  <meta property="og:locale" content="{{ c.og_locale }}">
  <meta property="og:locale:alternate" content="{{ other_c.og_locale }}">

  {# Twitter / X #}
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ c.meta.og_title }}">
  <meta name="twitter:description" content="{{ c.meta.og_description }}">
  <meta name="twitter:image" content="{{ site_url }}{{ url_for('static', filename='images/og-image.jpg') }}">

  <link rel="icon" type="image/svg+xml" href="{{ asset('favicon.svg') }}">
  <link rel="apple-touch-icon" href="{{ asset('images/illustrations/envelope.webp') }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">

  <link rel="stylesheet" href="{{ asset('css/main.css') }}">
  <link rel="stylesheet" href="{{ asset('css/avatars.css') }}">
  <link rel="preload" as="image" href="{{ asset('images/illustrations/stack.webp') }}">

  <script>document.documentElement.classList.replace('no-js','js');setTimeout(function(){document.documentElement.classList.add('is-ready')},2500);</script>

  <script type="application/ld+json">
  {{ {
    "@context": "https://schema.org",
    "@type": "Book",
    "name": "For You — " ~ c.product.subtitle,
    "description": c.meta.description,
    "bookFormat": "https://schema.org/EBook",
    "inLanguage": c.html_lang,
    "numberOfPages": 20,
    "genre": "Love letters",
    "image": site_url ~ url_for('static', filename='images/pages/cover-760.webp'),
    "url": canonical
  } | tojson }}
  </script>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
